rejoindreSurtitre: Les ateliers
rejoindreTitre: Devenez improvisateur·rice
rejoindreTexte: >-
  Pour découvrir le théâtre d'improvisation, vaincre ses peurs, créer des liens
  forts, affiner son jeu et retrouver le plaisir de la scène sans apprendre un
  texte.


  Débutants ou improvisateurs expérimentés, les ateliers accueillent tous les
  profils. Match, catch, cabaret, formes longues : tous les formats sont abordés
  à l'ASIL.
