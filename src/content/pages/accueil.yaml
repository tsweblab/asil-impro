pourquoiSurtitre: La troupe
pourquoiTitre: Pourquoi rejoindre l'ASIL ?
raisons:
  - titre: Créativité
    texte: >-
      Inventer des histoires sans texte, sans décor, sans filet : chaque atelier
      est un terrain de jeu illimité.
  - titre: La scène
    texte: >-
      Plus de 30 spectacles par saison dans les bars, théâtres et café-théâtres
      de Saint-Étienne. Le trac, puis le frisson.
  - titre: Liens humains
    texte: >-
      Une troupe soudée de plus de 100 improvisateurs et improvisatrices,
      débutants comme confirmés.
  - titre: Le fun
    texte: >-
      Loufoque, c'est dans notre nom. On vient pour rire, vaincre ses peurs et
      repartir avec le sourire.
rejoindreSurtitre: Les ateliers
rejoindreTitre: Devenez improvisateur·rice
rejoindreTexte: |-
  Pour découvrir le théâtre d'improvisation, vaincre ses peurs, créer des liens forts, affiner son jeu et retrouver le plaisir de la scène sans apprendre un texte.

  Débutants ou improvisateurs expérimentés, les ateliers accueillent tous les profils. Match, catch, cabaret, formes longues : tous les formats sont abordés à l'ASIL.
rejoindreBouton: Inscrivez-vous
rejoindreBoutonLien: /ateliers
