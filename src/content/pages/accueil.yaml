presentationSurtitre: Depuis 2002
presentationTitre: L'ASIL, c'est quoi ?
presentationTexte: >-
  Les Ateliers stéphanois d'improvisation loufoque sont une association créée
  en 2002. Elle dispense des cours d'improvisation tous niveaux et propose des
  spectacles de ses élèves toute l'année dans les bars, café-théâtres et lieux
  culturels de Saint-Étienne et sa région.
presentationCitation: « Qui vit sans folie n'est pas aussi sage qu'il le croit. »
ctaTitre: Rejoignez l'aventure
ctaTexte: >-
  Une question, une envie de monter sur scène, un lieu à nous proposer ?
  Écrivez-nous, on ne mord pas (sauf en impro).
ctaBouton: Contactez-nous
ctaBoutonLien: /contact
