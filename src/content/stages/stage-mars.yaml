description: >-
  Haaaa Destin ! Amateurs d'épopées, apprentis voyageurs temporels, ou tout
  simplement curieux de découvrir le temps des mythes, ce stage est pour vous !
  Les secrets des dieux de l'Olympe, les complots de Rome, les jeux du cirques
  et les marchés aux esclaves n'auront plus de secrets pour vous ! Tels Moise
  recevant les 10 commandements, telles les sirènes poursuivant Ulysse, tel
  Néron brulant Rome, venons nous amuser à explorer ce genre fabuleux !


  100% adapté à ceux qui n'y connaissent rien !


  (attention : apparitions divines possibles)
